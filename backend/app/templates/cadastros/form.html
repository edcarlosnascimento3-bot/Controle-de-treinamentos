{% extends "base.html" %}
{% block title %}{{ titulo }} · {{ app_name }}{% endblock %}
{% block content %}

<h1>{{ titulo }}</h1>
<p class="muted mb">Preencha o nome e salve.</p>

<form method="post" action="{{ acao }}">
  <div class="card">
    <div class="form-grid">
      <div class="field">
        <label>Nome *</label>
        <input type="text" name="nome" required maxlength="{{ maxlen }}" value="{{ item.nome if item else '' }}">
      </div>
    </div>
  </div>
  <div class="flex gap">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a class="btn btn-secondary" href="{{ url_base }}">Cancelar</a>
  </div>
</form>

{% endblock %}
