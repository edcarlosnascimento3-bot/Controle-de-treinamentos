{% extends "base.html" %}
{% block title %}Confirmação · {{ app_name }}{% endblock %}
{% block content_public %}
<div class="pagina-cartao">
  <div class="card" style="max-width:480px;margin:48px auto">
    <h1>Confirmar identidade</h1>
    <p class="muted mb">Este link é pessoal. Para visualizar os treinamentos, digite o <strong>nome completo cadastrado</strong> no sistema.</p>
    {% if erro %}<div class="alert alert-erro">{{ erro }}</div>{% endif %}
    <form method="post" action="{{ action }}">
      <div class="field"><label>Nome cadastrado *</label><input type="text" name="nome" required autofocus autocomplete="off"></div>
      <button class="btn btn-primary mt" type="submit">Visualizar treinamentos</button>
    </form>
  </div>
</div>
{% endblock %}
